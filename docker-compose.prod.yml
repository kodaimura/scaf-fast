services:
  api:
    build:
      context: ./api
    restart: always
    env_file:
      - ./api/.env
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --workers 4
    ports:
      - "8000:8000"

  migrate:
    build:
      context: ./api
    env_file:
      - ./api/.env
    command: alembic upgrade head
    restart: "no"
