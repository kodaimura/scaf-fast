services:
  api:
    build:
      context: ./api
    init: true
    restart: always
    env_file:
      - ./api/.env
    command: >
      sh -c "gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-4}"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ./api
    profiles:
      - tools
    init: true
    env_file:
      - ./api/.env
    command: alembic upgrade head
    restart: "no"
